name: Build AAA skola image

on:
  workflow_call:
    inputs:
      source:
        description: Full commit SHA from stafiocz/aaaskolacz
        required: true
        type: string
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
      image:
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: aaaskola_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: aaaskola_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U aaaskola_test" --health-interval 5s --health-timeout 3s --health-retries 10
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.source.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: stafiocz/aaaskolacz
          ref: ${{ inputs.source }}

      - name: Verify source
        id: source
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          echo "image=stafio/aaaskolacz:$(TZ=Europe/Prague date +%y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Check authentication and database
        working-directory: server
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: aaaskola_test
          PGPASSWORD: test-only-password
          PGDATABASE: aaaskola_test
        run: |
          npm ci
          npm test

      - name: Check and build Flutter web
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build web --release --no-web-resources-cdn
          printf '{"source":"%s"}\n' "$SOURCE" > build/web/release.json

      - uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.source.outputs.image }}

      - name: Check running container
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SOURCE: ${{ inputs.source }}
        run: |
          docker run -d --name aaaskola --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=aaaskola_test \
            -e PGPASSWORD=test-only-password -e PGDATABASE=aaaskola_test "$IMAGE"
          trap 'docker logs aaaskola; docker rm -f aaaskola' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import quote

          base = 'http://127.0.0.1:8080/'
          with urllib.request.urlopen(base + 'release.json') as response:
              assert json.load(response)['source'] == os.environ['SOURCE']
          with urllib.request.urlopen(base + 'api/me') as response:
              assert json.load(response)['user'] is None
          for path in Path('build/web').rglob('*'):
              if path.is_file() and not any(part.startswith('.') for part in path.relative_to('build/web').parts):
                  url = base + quote(path.relative_to('build/web').as_posix())
                  with urllib.request.urlopen(url) as response:
                      assert response.read() == path.read_bytes(), str(path)
          for path in ['.git/config', '.last_build_id', 'Dockerfile', 'pubspec.yaml', 'missing.js']:
              try:
                  urllib.request.urlopen(base + path)
              except urllib.error.HTTPError as error:
                  assert error.code == 404, (path, error.code)
              else:
                  raise AssertionError(path)
          print('All Flutter web files match the container; private files return 404.')
          PY

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push verified image
        id: push
        env:
          IMAGE: ${{ steps.source.outputs.image }}
        run: |
          docker push "$IMAGE"
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"
